name: ClipboardHistory
options:
  bundleIdPrefix: app.clipboard-history
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc signing by default so anyone can build. For a stable signature (keeps the Accessibility
    # grant across rebuilds), pass DEVELOPMENT_TEAM=<id> CODE_SIGN_IDENTITY="Apple Development" to xcodebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  ClipboardHistory:
    type: application
    platform: macOS
    sources: [Sources/ClipboardHistory]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Sources/ClipboardHistory/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: "Clipboard History"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clipboard-history
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO   # no get-task-allow: notarization rejects it
  ClipboardHistoryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ClipboardHistoryTests]
    dependencies:
      - target: ClipboardHistory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipboardHistory.app/Contents/MacOS/ClipboardHistory"
schemes:
  ClipboardHistory:
    build:
      targets: { ClipboardHistory: all, ClipboardHistoryTests: [test] }
    test:
      targets: [ClipboardHistoryTests]
